# Integración continua: en cada push y pull request comprueba que el proyecto
# compila, pasa los tipos y los tests. El DESPLIEGUE lo hace Vercel (conectado al repo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Instala la versión de pnpm indicada en "packageManager" de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
